<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="app">
        <section class="card">
            <img class="brand-image" src="img/Jordan sorteio.jpeg" alt="Ilustração do sorteador">

            <h1>Bem-vindo ao Sorteador!</h1>
            <p>Escolha se quer sortear números ou nomes, personalize o intervalo e aproveite uma experiência mais dinâmica.</p>

            <div class="controls">
                <label class="field">
                    <span>Tipo de sorteio</span>
                    <select id="tipoSorteio">
                        <option value="numero">Número</option>
                        <option value="nome">Nome</option>
                    </select>
                </label>

                <div id="configNumerica" class="config-group">
                    <label class="field">
                        <span>Mínimo</span>
                        <input type="number" id="min" placeholder="Mínimo" value="1">
                    </label>

                    <label class="field">
                        <span>Máximo</span>
                        <input type="number" id="max" placeholder="Máximo" value="100">
                    </label>
                </div>

                <div id="configNome" class="config-group hidden">
                    <label class="field field-full">
                        <span>Nomes</span>
                        <textarea id="nomes" rows="4" placeholder="Ana, Bruno, Carlos, Daniela"></textarea>
                    </label>
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" id="semRepetir">
                    <span>Sem repetir no mesmo ciclo</span>
                </label>

                <button id="sortearBtn" type="button">Sortear</button>
            </div>

            <div class="resultado-wrapper" aria-live="polite">
                <span class="resultado-label">Resultado</span>
                <div id="resultado" class="resultado">--</div>
            </div>
        </section>
    </main>

    <script type="module" src="raffle-core.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
