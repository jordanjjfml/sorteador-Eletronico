<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <img src="img/Jordan sorteio.jpeg" alt="Sorteador">

    <section>

        <h2>Bem-vindo ao Sorteador!</h2>
        <p>Este é um aplicativo simples para sortear números de 1 a 100. Clique no botão abaixo para gerar um número
            aleatório.</p>


        <section class="section-form">
            <input type="number" id="min" placeholder="Mínimo" value="1">
            <input type="number" id="max" placeholder="Máximo" value="100">
            <button onclick="sortear()">Sortear</button>
        </section>

    </section>

</body>

<script src="script.js"></script>

</html>
